<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <!-- Fonts matching the retro terminal & pixel artwork -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette sampled from user reference and qrcode_poster.pdf */
            --bg-deep: #160738;
            --bg-surface: #1d0a4a;
            --poster-indigo: #2a0f6e;
            --poster-lavender: #cdc3f7;
            --poster-lavender-dim: #9c8cdb;
            --poster-lavender-glow: rgba(205, 195, 247, 0.45);
            --poster-mint: #6ef2d6;
            --poster-mint-shadow: #2aa389;
            --poster-mint-glow: rgba(110, 242, 214, 0.45);
            --border-dark: #0f0426;
            --input-bg: #12052e;
            
            --font-pixel: 'Press Start 2P', monospace;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--poster-lavender);
            font-family: var(--font-pixel);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2.5rem 1rem 4rem;
            overflow-x: hidden;
            image-rendering: pixelated;
        }

        /* 
           Subtle Grain & Horizontal Scanline Grid 
           Recreates the CRT scanline and texture from the user's reference screenshot
        */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E"),
                linear-gradient(rgba(22, 7, 56, 0) 50%, rgba(10, 3, 25, 0.4) 50%),
                linear-gradient(90deg, rgba(205, 195, 247, 0.015) 1px, transparent 1px);
            background-size: auto, 100% 4px, 4px 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Ambient deep indigo radial glow behind the main container */
        body::after {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(42, 15, 110, 0.6) 0%, rgba(22, 7, 56, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Main Container with subtle shadow and atmospheric glow */
        .container {
            width: 92%;
            max-width: 620px;
            padding: 3rem 2.2rem;
            background: var(--bg-surface);
            border: 4px dashed var(--poster-lavender);
            text-align: center;
            position: relative;
            z-index: 1;
            /* Balanced shadow & soft non-overpowering glow */
            box-shadow: 
                8px 8px 0 var(--border-dark),
                0 0 35px rgba(205, 195, 247, 0.15),
                0 0 65px rgba(42, 15, 110, 0.75),
                inset 2px 2px 0 rgba(205, 195, 247, 0.18);
            margin-bottom: 2rem;
            transition: box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 
                8px 8px 0 var(--border-dark),
                0 0 45px rgba(205, 195, 247, 0.22),
                0 0 75px rgba(110, 242, 214, 0.18),
                inset 2px 2px 0 rgba(205, 195, 247, 0.25);
        }

        /* Pixel corner markers */
        .container::before {
            content: "■";
            position: absolute;
            top: -12px;
            left: -12px;
            font-size: 14px;
            color: var(--poster-mint);
            text-shadow: 0 0 8px var(--poster-mint-glow);
        }

        .container::after {
            content: "■";
            position: absolute;
            bottom: -12px;
            right: -12px;
            font-size: 14px;
            color: var(--poster-mint);
            text-shadow: 0 0 8px var(--poster-mint-glow);
        }

        /* 
           Header Typography with Bevels, Drop Shadow & Subtle Glow
           Accurately mirrors user's reference: 'QR CODE' in lavender, 'GENERATOR' in mint
        */
        h1 {
            font-family: var(--font-pixel);
            font-size: 1.85rem;
            line-height: 1.5;
            letter-spacing: -0.5px;
            margin-bottom: 0.9rem;
        }

        .title-qr {
            display: inline-block;
            color: #f3edfd;
            /* Top bevel, dark 3D bevel, drop shadow, and delicate non-overpowering lavender glow */
            text-shadow: 
                0 -2px 0 #ffffff,
                0 4px 0 #7b62b3,
                4px 6px 0 var(--border-dark),
                0 0 16px rgba(205, 195, 247, 0.4);
            letter-spacing: 2px;
        }

        .title-generator {
            display: inline-block;
            color: #9affeb;
            /* Top highlight, teal bevel, dark shadow, and soft cyan/mint glow */
            text-shadow: 
                0 -2px 0 #d0fff5,
                0 4px 0 #1b8570,
                4px 6px 0 var(--border-dark),
                0 0 18px rgba(110, 242, 214, 0.45);
            letter-spacing: 2px;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 1.05rem;
            color: var(--poster-lavender);
            opacity: 0.9;
            letter-spacing: 3px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(205, 195, 247, 0.25);
        }

        /* 
           Interactive Sequential Flickering Square Cubes
           10 cubes with alternating mint, lavender, and hollow purple modules.
           They flicker with wave-like timing one after another.
        */
        .pixel-bar {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-bottom: 2.3rem;
        }

        .cube {
            width: 14px;
            height: 14px;
            display: block;
            box-shadow: 2px 2px 0 var(--border-dark);
            position: relative;
            animation: cubeFlicker 3s infinite ease-in-out;
        }

        /* Wave delay so they flicker one by one across the row */
        .cube:nth-child(1)  { animation-delay: 0.0s; }
        .cube:nth-child(2)  { animation-delay: 0.25s; }
        .cube:nth-child(3)  { animation-delay: 0.5s; }
        .cube:nth-child(4)  { animation-delay: 0.75s; }
        .cube:nth-child(5)  { animation-delay: 1.0s; }
        .cube:nth-child(6)  { animation-delay: 1.25s; }
        .cube:nth-child(7)  { animation-delay: 1.5s; }
        .cube:nth-child(8)  { animation-delay: 1.75s; }
        .cube:nth-child(9)  { animation-delay: 2.0s; }
        .cube:nth-child(10) { animation-delay: 2.25s; }

        /* Color variants matching reference screenshot */
        .cube-mint {
            background: var(--poster-mint);
            box-shadow: 2px 2px 0 var(--border-dark), 0 0 8px rgba(110, 242, 214, 0.4);
        }

        .cube-lavender {
            background: var(--poster-lavender);
            box-shadow: 2px 2px 0 var(--border-dark), 0 0 8px rgba(205, 195, 247, 0.35);
        }

        .cube-hollow {
            background: var(--input-bg);
            border: 2px solid var(--poster-indigo);
            box-shadow: 2px 2px 0 var(--border-dark);
        }

        /* Sequential flicker animation: soft pulse & glow without jarring blink */
        @keyframes cubeFlicker {
            0%, 100% {
                transform: translateY(0);
                filter: brightness(1);
            }
            8% {
                transform: translateY(-3px);
                filter: brightness(1.75);
                box-shadow: 2px 5px 0 var(--border-dark), 0 0 14px var(--poster-mint-glow);
            }
            16% {
                transform: translateY(0);
                filter: brightness(1.2);
            }
            24% {
                transform: translateY(-1px);
                filter: brightness(1.4);
            }
            32% {
                transform: translateY(0);
                filter: brightness(1);
            }
        }

        /* Form */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        label {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            letter-spacing: 4px;
            color: var(--poster-lavender-dim);
            align-self: flex-start;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label .bullet {
            color: var(--poster-mint);
            font-size: 0.75rem;
            text-shadow: 0 0 6px var(--poster-mint-glow);
        }

        /* Chunky Pixel Inputs */
        .input-box, .select-wrapper {
            border: 4px solid var(--poster-lavender);
            padding: 3px;
            background: var(--poster-lavender);
            box-shadow: 4px 4px 0 var(--border-dark);
            transition: all 0.2s ease;
        }

        .input-box:focus-within, .select-wrapper:focus-within {
            border-color: var(--poster-mint);
            background: var(--poster-mint);
            box-shadow: 4px 4px 0 var(--border-dark), 0 0 16px var(--poster-mint-glow);
        }

        input[type="text"], select {
            width: 100%;
            background: var(--input-bg);
            border: none;
            color: var(--poster-lavender);
            font-family: var(--font-mono);
            font-size: 1.15rem;
            padding: 0.95rem 1rem;
            outline: none;
            display: block;
        }

        input::placeholder {
            color: rgba(205, 195, 247, 0.35);
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            padding-right: 2.8rem;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--poster-lavender);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .select-wrapper:focus-within::after {
            color: var(--input-bg);
        }

        select option {
            background: var(--bg-surface);
            color: var(--poster-lavender);
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
        }

        /* Chunky Pixel Button with Subtle Mint Glow */
        button {
            font-family: var(--font-pixel);
            font-size: 0.85rem;
            background: var(--poster-mint);
            color: var(--border-dark);
            border: none;
            padding: 1.25rem 1rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 
                6px 6px 0 var(--border-dark),
                0 0 16px rgba(110, 242, 214, 0.25),
                inset -3px -3px 0 var(--poster-mint-shadow),
                inset 3px 3px 0 rgba(255, 255, 255, 0.6);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        button:hover {
            transform: translate(2px, 2px);
            box-shadow: 
                4px 4px 0 var(--border-dark),
                0 0 22px rgba(110, 242, 214, 0.4),
                inset -3px -3px 0 var(--poster-mint-shadow),
                inset 3px 3px 0 rgba(255, 255, 255, 0.6);
        }

        button:active {
            transform: translate(6px, 6px);
            box-shadow: 
                none,
                inset 2px 2px 0 var(--poster-mint-shadow);
        }

        /* Error notification */
        .error {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: #ff6b81;
            margin-top: 1.2rem;
            letter-spacing: 1px;
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 0 #fff; }
            50% { text-shadow: -2px 0 var(--poster-mint); }
            100% { text-shadow: 2px 0 #ff6b81; }
        }

        /* Generated QR display */
        .qr-display {
            margin-top: 2.2rem;
            padding: 1.8rem 1.2rem;
            border: 3px solid var(--poster-lavender);
            background: rgba(18, 5, 46, 0.8);
            box-shadow: 
                6px 6px 0 var(--border-dark),
                0 0 24px rgba(205, 195, 247, 0.15);
        }

        .qr-display p {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--poster-lavender);
            margin-bottom: 1.2rem;
            word-break: break-all;
            letter-spacing: 1px;
        }

        .qr-display p strong {
            color: var(--poster-mint);
            text-shadow: 0 0 8px var(--poster-mint-glow);
        }

        /* Framed QR code image with slight soft glow */
        .qr-display img {
            border: 4px solid var(--border-dark);
            outline: 3px solid var(--poster-lavender);
            max-width: 210px;
            width: 100%;
            display: inline-block;
            box-shadow: 
                4px 4px 0 var(--border-dark),
                0 0 16px rgba(205, 195, 247, 0.25);
            image-rendering: pixelated;
        }

        /* Signature in bottom-right corner */
        .signature {
            position: fixed;
            bottom: 16px;
            right: 22px;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--poster-lavender);
            opacity: 0.65;
            text-shadow: 0 0 8px var(--poster-lavender-glow);
            letter-spacing: 1px;
            user-select: none;
            z-index: 1000;
            transition: opacity 0.3s ease, text-shadow 0.3s ease, color 0.3s ease;
        }

        .signature:hover {
            opacity: 1;
            color: var(--poster-mint);
            text-shadow: 0 0 15px rgba(110, 242, 214, 0.9);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.35rem; }
            .subtitle { font-size: 0.85rem; }
            .container { padding: 2rem 1.1rem; }
            .pixel-bar { gap: 6px; }
            .cube { width: 10px; height: 10px; }
            button { font-size: 0.75rem; padding: 1.1rem 0.8rem; }
            .signature { font-size: 0.75rem; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            <span class="title-qr">QR CODE</span><br>
            <span class="title-generator">GENERATOR</span>
        </h1>
        <p class="subtitle">PASTE YOUR URL HERE &gt; GET YOUR CODE</p>
        
        <!-- 10 Interactive Flickering Pixel Cubes -->
        <div class="pixel-bar" aria-label="Interactive status modules">
            <span class="cube cube-mint"></span>
            <span class="cube cube-hollow"></span>
            <span class="cube cube-lavender"></span>
            <span class="cube cube-mint"></span>
            <span class="cube cube-lavender"></span>
            <span class="cube cube-hollow"></span>
            <span class="cube cube-mint"></span>
            <span class="cube cube-hollow"></span>
            <span class="cube cube-lavender"></span>
            <span class="cube cube-mint"></span>
        </div>

        <form method="post">
            <label for="url">
                <span class="bullet">►</span> WEBSITE URL
            </label>
            <div class="input-box">
                <input type="text" id="url" name="url" placeholder="https://example.com" required autocomplete="url" autofocus>
            </div>

            <label for="color_scheme">
                <span class="bullet">►</span> COLOR SCHEME
            </label>
            <div class="select-wrapper">
                <select id="color_scheme" name="color_scheme" required>
                    <option value="red_black"   {% if selected_scheme == 'red_black' %}selected{% endif %}>Red / Black (Default)</option>
                    <option value="black_white" {% if selected_scheme == 'black_white' %}selected{% endif %}>Black / White</option>
                    <option value="green_black" {% if selected_scheme == 'green_black' %}selected{% endif %}>Green / Black</option>
                    <option value="green_white" {% if selected_scheme == 'green_white' %}selected{% endif %}>Green / White</option>
                </select>
            </div>

            <button type="submit">► GENERATE QR CODE</button>
        </form>

        {% if error %}
            <p class="error">⚠ SYSTEM ERROR: {{ error }}</p>
        {% endif %}

        {% if img_data %}
        <div class="qr-display">
            <p>TARGET ACQUIRED:<br><strong>{{ url }}</strong></p>
            <img src="data:image/png;base64,{{ img_data }}" alt="Generated QR Code">
        </div>
        {% endif %}
    </div>

    <div class="signature">// amitabh sohani</div>

</body>
</html>
