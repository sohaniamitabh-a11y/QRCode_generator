<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --primary-red: #ff1a1a;
            --dark-red: #4a0000;
            --text-glow: 0 0 10px rgba(255, 26, 26, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--primary-red);
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* CRT Scanline Effect */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 999;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 3rem 2rem;
            border: 4px dashed var(--primary-red);
            background: #0a0a0a;
            text-align: center;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 26, 26, 0.1);
        }

        h1 {
            font-size: 2rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            text-shadow: 4px 4px 0 var(--dark-red);
            letter-spacing: -1px;
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            color: #ff4d4d;
            letter-spacing: 3px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .pixel-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2rem;
        }
        .pixel-bar span {
            width: 12px; height: 12px;
            background: var(--primary-red);
            display: block;
        }
        .pixel-bar span:nth-child(even) { background: var(--dark-red); }

        form { display: flex; flex-direction: column; gap: 1.5rem; }

        label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 5px;
            color: #cc1414;
            align-self: flex-start;
        }

        .input-box {
            border: 4px solid var(--primary-red);
            padding: 4px;
            background: var(--primary-red);
        }

        input[type="text"] {
            width: 100%;
            background: #1a0000;
            border: none;
            color: var(--primary-red);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            padding: 1rem;
            outline: none;
        }
        input::placeholder { color: #5c1010; }

        /* Custom Select Dropdown Styling */
        .select-wrapper {
            position: relative;
            border: 4px solid var(--primary-red);
            padding: 4px;
            background: var(--primary-red);
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-red);
            font-size: 1rem;
            pointer-events: none;
        }

        select {
            width: 100%;
            background: #1a0000;
            border: none;
            color: var(--primary-red);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            padding: 1rem;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
        }

        select option {
            background: #0a0a0a;
            color: var(--primary-red);
            padding: 1rem;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            background: var(--primary-red);
            color: #000;
            border: none;
            padding: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 6px 6px 0 var(--dark-red);
            transition: transform 0.1s;
        }
        button:hover { transform: translate(2px, 2px); box-shadow: 4px 4px 0 var(--dark-red); }
        button:active { transform: translate(6px, 6px); box-shadow: none; }

        .error {
            font-family: 'Share Tech Mono', monospace;
            color: #ff4d4d;
            margin-top: 1rem;
            animation: glitch 0.3s infinite;
        }

        .qr-display {
            margin-top: 2rem;
            padding: 1.5rem;
            border: 2px solid var(--primary-red);
            background: rgba(20, 0, 0, 0.5);
        }
        .qr-display p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            word-break: break-all;
        }
        .qr-display img {
            border: 4px solid #000;
            outline: 2px solid var(--primary-red);
            max-width: 200px;
            width: 100%;
        }

        /* SIGNATURE: BOTTOM RIGHT */
        .creator-sig {
            position: fixed;
            bottom: 15px;
            right: 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--primary-red);
            text-shadow: 0 0 10px rgba(255, 26, 26, 0.8), 2px 2px 0 var(--dark-red);
            z-index: 1000;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 0 #fff; }
            100% { text-shadow: -2px 0 #00ffff; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .subtitle { font-size: 0.8rem; }
            .container { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>QR CODE<br>GENERATOR</h1>
        <p class="subtitle">Paste your URL here &gt; Get your code</p>
        
        <div class="pixel-bar">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>

        <form method="post">
            <label for="url">WEBSITE URL</label>
            <div class="input-box">
                <input type="text" id="url" name="url" placeholder="https://example.com" required autocomplete="url">
            </div>

            <label for="color_scheme">COLOR SCHEME</label>
            <div class="select-wrapper">
                <select id="color_scheme" name="color_scheme" required>
                    <option value="red_black"   {% if selected_scheme == 'red_black' %}selected{% endif %}>Red / Black (Default)</option>
                    <option value="black_white" {% if selected_scheme == 'black_white' %}selected{% endif %}>Black / White</option>
                    <option value="green_black" {% if selected_scheme == 'green_black' %}selected{% endif %}>Green / Black</option>
                    <option value="green_white" {% if selected_scheme == 'green_white' %}selected{% endif %}>Green / White</option>
                </select>
            </div>

            <button type="submit">► GENERATE QR CODE</button>
        </form>

        {% if error %}
            <p class="error">⚠ SYSTEM ERROR: {{ error }}</p>
        {% endif %}

        {% if img_data %}
        <div class="qr-display">
            <p>TARGET ACQUIRED:<br><strong>{{ url }}</strong></p>
            <img src="data:image/png;base64,{{ img_data }}" alt="Generated QR Code">
        </div>
        {% endif %}
    </div>

    <!-- Signature: Bottom Right -->
    <div class="creator-sig">AMITABH SOHANI</div>

</body>
</html>
